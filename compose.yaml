name: rag-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag          # local only; never reused anywhere else
    ports:
      - "5433:5432"                   # use "5433:5432" if a local Postgres already uses 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      # healthy only once the init script has created the last queue
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "ingestion"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data: