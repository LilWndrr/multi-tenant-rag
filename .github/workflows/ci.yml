name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # has Docker, which the Testcontainers tests need
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: No language names in Java code
        run: scripts/check-no-language-names.sh

      # OPENROUTER_API_KEY is not set here, so ModelGatewayLiveTest is skipped
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
