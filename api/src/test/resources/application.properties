rag.admin.token=test-token

# URLs come from TestcontainersConfiguration; V3 creates the app user from these (must match APP_USER/APP_PASSWORD there)
spring.datasource.username=rag_app
spring.datasource.password=rag_app_test
spring.flyway.placeholders.app_user=${spring.datasource.username}
spring.flyway.placeholders.app_password=${spring.datasource.password}

# real key when OPENROUTER_API_KEY is set (ModelGatewayIT), placeholder otherwise so the Spring AI beans start
spring.ai.openai.api-key=${OPENROUTER_API_KEY:test-placeholder}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.retry.max-attempts=1
rag.models.chat=nvidia/nemotron-3.5-super-vl:free
rag.models.embedding=nvidia/nemotron-3.5-embed-1b:free
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.max-retries=0

# AWS: no endpoint until the LocalStack Testcontainer sets one
rag.aws.region=eu-central-1
rag.aws.s3.bucket=rag-documents
rag.aws.sqs.queue=ingestion
# uploads: same limits as main
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB