spring.application.name=api
# local secrets from the repo-root .env (gitignored); ../ covers IDE runs from the module folder
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5433/rag
# the app logs in as rag_app, which row-level security applies to (rag is a superuser and would bypass it)
spring.datasource.username=rag_app
spring.datasource.password=${APP_DB_PASSWORD:rag_app}
# Flyway runs as the owner and creates rag_app in V3 with the datasource's name and password
spring.flyway.user=rag
spring.flyway.password=rag
spring.flyway.placeholders.app_user=${spring.datasource.username}
spring.flyway.placeholders.app_password=${spring.datasource.password}

rag.admin.token=${ADMIN_TOKEN:}
rag.models.chat=nvidia/nemotron-3.5-super-vl:free
rag.models.embedding=nvidia/nemotron-3.5-embed-1b:free

# Spring AI: OpenRouter key from the environment; only chat + embedding are used
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.retry.max-attempts=1
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.max-retries=0

# AWS: LocalStack locally; leave the endpoint empty for real AWS
rag.aws.endpoint=http://localhost:4566
rag.aws.region=eu-central-1
rag.aws.s3.bucket=rag-documents
rag.aws.sqs.queue=ingestion

# uploads: larger files are refused with 413 before the controller runs
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
